[project]
name = "jurimetria"
version = "0.1.0"
description = "Material e código do curso 'Jurimetria e Análise de Dados para Decisões Estratégicas' (IBMEC)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "IBMEC — Curso de Jurimetria" },
]
keywords = ["jurimetria", "direito", "data-science", "pandas", "ibmec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pandas>=3.0.2",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jurimetria"]

[tool.uv]
package = true

# ------------------------------------------------------------------ #
#  Configuração de ferramentas                                        #
# ------------------------------------------------------------------ #

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "aulas/**/dados"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/notebooks/**/*.ipynb" = ["E402", "F401"]
"tests/**" = ["F401"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
